mutation TransactionInitializeMutation(
  $id: ID!
  $data: JSON
  $amount: PositiveDecimal
  $gatewayAppId: String!
  $idempotencyKey: String
) {
  transactionInitialize(
    id: $id
    amount: $amount
    idempotencyKey: $idempotencyKey
    paymentGateway: { id: $gatewayAppId, data: $data }
  ) {
    transaction {
      id
    }
    transactionEvent {
      id
      type
      message
    }
    data
    errors {
      field
      message
      code
    }
  }
}
