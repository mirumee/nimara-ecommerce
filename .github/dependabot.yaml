version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Warsaw"
    commit-message:
      prefix: "chore(deps)"
    target-branch: "main"
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "patch"
          - "minor"

      development-dependencies:
        dependency-type: "development"
        update-types:
          - "patch"
          - "minor"

    # Major versions should be updated manually, to avoid breaking changes.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Majors are allowed here on purpose. A major action bump is normally just a
  # runner-runtime change, and blocking them is why these fell eight versions
  # behind. Grouped into one weekly pull request.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Warsaw"
    commit-message:
      prefix: "chore(ci)"
    target-branch: "main"
    groups:
      github-actions:
        patterns:
          - "*"
