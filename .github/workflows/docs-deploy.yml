name: Deploy Docs to GitHub Pages

on:
  # Chained off CI rather than triggered by the `main` push directly, so
  # documentation is only published from a commit that passed its checks.
  workflow_run:
    workflows:
      - "Linters & Tests"
    types:
      - completed
    branches:
      - main
  push:
    # A release republishes the docs at the tagged commit. CI also runs on tag
    # pushes, but the `branches` filter above keeps that run from duplicating
    # this one.
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # For workflow_run events, only build when CI succeeded. All other triggers
    # (tag push, workflow_dispatch) always build.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # A workflow_run must publish the commit that completed CI, not
          # whichever commit happens to be at the tip of main when this job starts.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/krypton"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        working-directory: apps/docs
        run: pnpm install --frozen-lockfile

      - name: Build docs
        working-directory: apps/docs
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/build

  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
