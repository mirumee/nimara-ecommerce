name: Build Saleor apps

on:
  push:
    branches: [main]
    tags: ["*"]
  workflow_dispatch:
    inputs:
      app:
        description: "Directory under apps/ to build. Empty builds every node-target app."
        required: false
        type: string

jobs:
  # Only apps the template generated for `BUILD_TARGET=node`: the command
  # match keeps the template itself and the Next.js apps out, and the target
  # check keeps out an app like `stripe` that deploys to Vercel already. On a
  # push, only those turbo reports as affected by the merge (their own files
  # or a package they depend on).
  changed:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.detect.outputs.apps }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/krypton"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Detect affected apps
        id: detect
        env:
          APP: ${{ inputs.app }}
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          # A tag push sends a zero sha here, which turbo reports as an
          # unreadable range and treats as everything changed.
          TURBO_SCM_BASE: ${{ github.event.before }}
          TURBO_SCM_HEAD: ${{ github.sha }}
        run: |
          candidates='[.tasks[]
                       | select(.task == "build")
                       | select(.command == "node etc/build.ts")
                       | select(.directory != "templates/app")
                       | select(.directory | startswith("apps/"))
                       | { name: .package, dir: (.directory | split("/") | last) }]'

          if [ "$IS_DISPATCH" != "true" ]; then
            raw=$(npx turbo run build --affected --dry=json | jq -c "$candidates")
          else
            # Every candidate, narrowed if one was named. Not `--affected`:
            # with no base it compares against the default branch, so a manual
            # run would build only what this branch has and `main` does not.
            raw=$(npx turbo run build --dry=json | jq -c "$candidates")

            if [ -n "$APP" ]; then
              named=$(echo "$raw" | jq -c --arg app "$APP" '[.[] | select(.dir == $app)]')

              # Checked here rather than left to `--filter`, which rejects an
              # unknown package only after `quality` has run.
              if [ "$named" = "[]" ]; then
                echo "::error::No app named '$APP'. Candidates: $(echo "$raw" | jq -r 'map(.dir) | join(", ")')."
                exit 1
              fi

              raw=$named
            fi
          fi

          apps='[]'

          for dir in $(echo "$raw" | jq -r '.[].dir'); do
            if grep -q '^BUILD_TARGET=node$' "apps/$dir/.env.example"; then
              entry=$(echo "$raw" | jq -c --arg dir "$dir" '.[] | select(.dir == $dir)')
              apps=$(echo "$apps" | jq -c --argjson e "$entry" '. + [$e]')
            fi
          done

          echo "apps=$apps" >> "$GITHUB_OUTPUT"

          # Also to the run summary: an empty list skips `quality` and `build`,
          # and a skipped run reads like a broken one without a reason next to it.
          {
            echo "### Apps to build"
            echo "$apps" | jq -r 'if length == 0
                                  then "Nothing affected by this merge."
                                  else .[] | "- `\(.name)`" end'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  quality:
    needs: changed
    if: needs.changed.outputs.apps != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/krypton"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check eslint and tests
        env:
          APPS: ${{ needs.changed.outputs.apps }}
        run: |
          filters=$(echo "$APPS" | jq -r '.[] | "--filter=" + .name' | tr '\n' ' ')
          npx turbo run lint test $filters

      - name: Check types
        env:
          APPS: ${{ needs.changed.outputs.apps }}
        run: |
          filters=$(echo "$APPS" | jq -r '.[] | "--filter=" + .name' | tr '\n' ' ')
          pnpm $filters lint:types

  build:
    needs: [changed, quality]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.changed.outputs.apps) }}
    env:
      AWS_DEFAULT_REGION: eu-central-1
      BUILD_TARGET: node
    steps:
      # Shallow: nothing here reads history. `changed` is the job that needs it,
      # to diff against the commit the merge started from.
      - uses: actions/checkout@v7

      # Seven characters explicitly: git widens the default as a repo grows,
      # and a tag pinned to a deploy would want a fixed-width sha.
      - name: Create GIT_SHA variable
        run: echo "GIT_SHA=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/krypton"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          APP_NAME: ${{ matrix.app.name }}
        run: npx turbo run build --filter="$APP_NAME"

      # One zip per app. A service inside it is `<service>/<entry>.js`, so the
      # Lambda handler is `<service>/entry-server.handler` for an HTTP or
      # dashboard service, `<service>/entry-queue.handler` for a queue-driven
      # one, and `<service>/entry-event.handler` for an invoked one.
      - name: Create artifact
        working-directory: apps/${{ matrix.app.dir }}/dist
        run: zip -r -D "$GITHUB_WORKSPACE/artifact.zip" .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Copy ZIP
        env:
          APP_DIR: ${{ matrix.app.dir }}
          AWS_BUCKET: ${{ vars.AWS_BUCKET }}
        run: aws s3 cp artifact.zip "$AWS_BUCKET/$APP_DIR/lambda-$GIT_SHA.zip" --quiet

      # To the run summary as well as the log: the matrix gives each app its
      # own, and the tag is what a deploy would pin.
      - name: ZIP tag
        env:
          APP_DIR: ${{ matrix.app.dir }}
          APP_NAME: ${{ matrix.app.name }}
        run: |
          {
            echo "### $APP_NAME"
            echo ""
            echo "- Tag: \`$GIT_SHA\`"
            echo "- ZIP: \`$APP_DIR/lambda-$GIT_SHA.zip\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"
