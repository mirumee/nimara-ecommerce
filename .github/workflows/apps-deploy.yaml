name: Deploy a Saleor app

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Directory under apps/ to build. Empty builds every node-target app."
        required: false
        type: string

jobs:
  # Same candidates as `apps-build.yaml`'s automatic run, minus `--affected`:
  # a manual run has no merge to diff against, and should build what is
  # asked for regardless of what changed.
  changed:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.detect.outputs.apps }}
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/krypton"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Detect apps
        id: detect
        env:
          APP: ${{ inputs.app }}
        run: |
          candidates='[.tasks[]
                       | select(.task == "build")
                       | select(.command == "node etc/build.ts")
                       | select(.directory != "templates/app")
                       | select(.directory | startswith("apps/"))
                       | { name: .package, dir: (.directory | split("/") | last) }]'

          raw=$(npx turbo run build --dry=json | jq -c "$candidates")

          if [ -n "$APP" ]; then
            named=$(echo "$raw" | jq -c --arg app "$APP" '[.[] | select(.dir == $app)]')

            # Checked here rather than left to `--filter`, which rejects an
            # unknown package only after `quality` has run.
            if [ "$named" = "[]" ]; then
              echo "::error::No app named '$APP'. Candidates: $(echo "$raw" | jq -r 'map(.dir) | join(", ")')."
              exit 1
            fi

            raw=$named
          fi

          apps='[]'

          for dir in $(echo "$raw" | jq -r '.[].dir'); do
            if grep -q '^BUILD_TARGET=node$' "apps/$dir/.env.example"; then
              entry=$(echo "$raw" | jq -c --arg dir "$dir" '.[] | select(.dir == $dir)')
              apps=$(echo "$apps" | jq -c --argjson e "$entry" '. + [$e]')
            fi
          done

          echo "apps=$apps" >> "$GITHUB_OUTPUT"

          {
            echo "### Apps to build"
            echo "$apps" | jq -r 'if length == 0
                                  then "Nothing matched."
                                  else .[] | "- `\(.name)`" end'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  quality:
    needs: changed
    if: needs.changed.outputs.apps != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/krypton"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check eslint and tests
        env:
          APPS: ${{ needs.changed.outputs.apps }}
        run: |
          filters=$(echo "$APPS" | jq -r '.[] | "--filter=" + .name' | tr '\n' ' ')
          npx turbo run lint test $filters

      - name: Check types
        env:
          APPS: ${{ needs.changed.outputs.apps }}
        run: |
          filters=$(echo "$APPS" | jq -r '.[] | "--filter=" + .name' | tr '\n' ' ')
          pnpm $filters lint:types

  build:
    needs: [changed, quality]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.changed.outputs.apps) }}
    env:
      AWS_DEFAULT_REGION: eu-central-1
      BUILD_TARGET: node
    steps:
      - uses: actions/checkout@v7

      # Seven characters explicitly: git widens the default as a repo grows,
      # and a tag pinned to a deploy would want a fixed-width sha.
      - name: Create GIT_SHA variable
        run: echo "GIT_SHA=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/krypton"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          APP_NAME: ${{ matrix.app.name }}
        run: npx turbo run build --filter="$APP_NAME"

      # One zip per app. A service inside it is `<service>/<entry>.js`, so the
      # Lambda handler is `<service>/entry-server.handler` for an HTTP or
      # dashboard service, `<service>/entry-queue.handler` for a queue-driven
      # one, and `<service>/entry-event.handler` for an invoked one.
      - name: Create artifact
        working-directory: apps/${{ matrix.app.dir }}/dist
        run: zip -r -D "$GITHUB_WORKSPACE/artifact.zip" .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Copy ZIP
        env:
          APP_DIR: ${{ matrix.app.dir }}
          AWS_BUCKET: ${{ vars.AWS_BUCKET }}
        run: aws s3 cp artifact.zip "$AWS_BUCKET/$APP_DIR/lambda-$GIT_SHA.zip" --quiet

      - name: ZIP tag
        env:
          APP_DIR: ${{ matrix.app.dir }}
          APP_NAME: ${{ matrix.app.name }}
        run: |
          {
            echo "### $APP_NAME"
            echo ""
            echo "- Tag: \`$GIT_SHA\`"
            echo "- ZIP: \`$APP_DIR/lambda-$GIT_SHA.zip\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"
