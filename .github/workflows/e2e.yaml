name: E2E tests & Lighthouse

on:
  # Manual trigger of the workflow
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment URL to run e2e tests against"
        type: string
        required: true

jobs:
  e2e-tests:
    name: "E2E tests & Lighthouse"
    runs-on: ubuntu-latest
    env:
      TEST_ENV_URL: ${{ inputs.environment }}
      USER_EMAIL: ${{ secrets.USER_EMAIL }}
      USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
      CI: true

    steps:
      - run: |
          echo "TEST_ENV_URL: $TEST_ENV_URL"

      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/krypton"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for CodeceptJS
        working-directory: apps/automated-tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e tests
        run: pnpm run test:e2e

      - name: Upload CodeceptJS output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeceptjs-output
          path: apps/automated-tests/output
          if-no-files-found: ignore
          retention-days: 7

      - name: Install Lighthouse CI
        if: always()
        run: pnpm add -D @lhci/cli -w

      - name: Run Lighthouse CI
        if: always()
        run: pnpm exec lhci autorun
        continue-on-error: true
